# Config for Vim ALE setup
[flake8]
# 122: continuation line missing indentation or outdented
# 126: : continuation lines are over-indented (not normal block indented)
# 20{1,2} list whitespace
# 225: missing whitespace around operator
# 226: missing whitespace around arithmetic operator
# 261: at least two spaces before inline comment
# 266: : block comment 
# 301: : some functions are grouped (no blank line)
# 302: expected 2 blank lines, found 1: using single line to group
# 306: : some inline functions are grouped as well (no blank line)
# 501: : line length
# 701: : single statement per line rule
ignore = E126, E201, E202, E225, E226, E261, E266, E301, E302, E306, E501, E701
# XXX: cannot get support for flake8: noqa:
